# Plesk (Windows) nginx reverse-proxy directives for Cruise Bingo.
#
# Where to paste:
#   Plesk > Websites & Domains > bingo.pssgroup.app > Apache & nginx Settings
#   -> enable "Proxy mode" is NOT needed; instead scroll to
#      "Additional nginx directives" and paste the block below -> OK.
#   (Also UNtick "Smart static files processing" if the game assets 404.)
#
# This makes nginx (which Plesk runs in front of IIS) proxy everything to the
# Node app on 127.0.0.1:3000 and pass the WebSocket upgrade through.
# Issue the Let's Encrypt certificate first via Plesk "SSL It!".

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
