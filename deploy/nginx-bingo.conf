# nginx site for bingo.pssgroup.app — reverse-proxies to the Node server on
# 127.0.0.1:3000 and upgrades the /ws WebSocket connection.
#
# Install:
#   sudo cp deploy/nginx-bingo.conf /etc/nginx/conf.d/bingo.pssgroup.app.conf
#   sudo nginx -t && sudo systemctl reload nginx
# Then issue TLS:
#   sudo certbot --nginx -d bingo.pssgroup.app
# (certbot rewrites the :80 block to redirect and fills in the ssl_* lines.)
#
# Files in conf.d/ are included inside nginx's http{} context, so this `map`
# can live here. If you use sites-available/ instead, that also works.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name bingo.pssgroup.app;

    # Before certbot runs, this serves plain HTTP. After certbot, it manages
    # the redirect to HTTPS automatically.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;   # keep idle WebSockets alive
        proxy_send_timeout 3600s;
    }
}

# --- After `certbot --nginx` you will also have a `listen 443 ssl` server
#     block with the same location{} body. If you prefer to configure TLS by
#     hand instead of certbot, use the template below and point the cert paths
#     at your own certificate/key, then remove the port-80 location above and
#     replace it with: `location / { return 301 https://$host$request_uri; }`
